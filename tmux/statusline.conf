# vim: ft=tmux
# Catppuccin Mocha, hardcoded (no theme plugin)

%hidden BG="#1e1e2e"
%hidden FG="#cdd6f4"
%hidden BLUE="#89b4fa"
%hidden RED="#f38ba8"
%hidden PEACH="#fab387"
%hidden ROSEWATER="#f5e0dc"
%hidden OVERLAY="#6c7086"
%hidden SURFACE="#313244"

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-style "bg=$BG,fg=$FG"

set -g message-style "bg=$SURFACE,fg=$FG"
set -g message-command-style "bg=$SURFACE,fg=$FG"
set -g mode-style "bg=$SURFACE,fg=$FG"

set -g pane-border-style "fg=$SURFACE"
set -g pane-active-border-style "fg=$OVERLAY"

# Left: session name, turns red while the prefix is held
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[bg=$RED#,fg=$BG#,bold],#[fg=$BLUE]}  #S #[default]"

set -g status-right-length 100
set -g status-right "#[fg=$BLUE]#{?window_zoomed_flag,󰁌 ,}"

set -g window-status-format " #I: #W "
set -g window-status-current-format " #I: #W "
set -g window-status-style "bg=$BG,fg=$ROSEWATER"
set -g window-status-current-style "bg=$BLUE,fg=$BG,bold"
set -g window-status-last-style "bg=$BG,fg=$PEACH,bold"
set -g window-status-activity-style "bg=$RED,fg=$BG"
set -g window-status-bell-style "bg=$RED,fg=$BG,bold"
set -gF window-status-separator "#[bg=$BG,fg=$OVERLAY]│"
